<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dot Gradients -->
    <linearGradient id="dot-blue-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7dd3fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dot-blue-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3f51b5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a237e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dot-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="30" />
      <feOffset dx="0" dy="20" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Inner Glow -->
    <filter id="inner-glow">
      <feFlood flood-color="white" flood-opacity="0.9" result="flood" />
      <feComposite in="flood" in2="SourceGraphic" operator="out" result="mask" />
      <feGaussianBlur in="mask" stdDeviation="8" result="blur" />
      <feComposite in="blur" in2="SourceGraphic" operator="atop" result="glow" />
    </filter>
  </defs>

  <!-- The "Komment" Bubble - Larger and more centered -->
  <g filter="url(#shadow)">
    <path d="M150 250 H874 C940 250 974 300 974 370 V630 C974 700 940 750 874 750 H360 L120 880 V750 C60 750 50 700 50 630 V370 C50 300 84 250 150 250 Z" fill="white" filter="url(#inner-glow)" />
    
    <!-- Three Connection Dots - More Spacing (200px centers) -->
    <circle cx="312" cy="500" r="80" fill="url(#dot-blue-light)" />
    <circle cx="512" cy="500" r="80" fill="url(#dot-blue-dark)" />
    <circle cx="712" cy="500" r="80" fill="url(#dot-red)" />
  </g>
</svg>

